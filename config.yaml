# GlacierTDB 配置
# 多库模型：一个库 = db_dir 目录下一个 <库名>.db 文件
# 所有项均可省略，省略时使用内置默认值。

# 监听地址（MySQL/RESP/AMQP/MQTT 端口复用）——IPv6 示例：
#   0.0.0.0:3309                    仅 IPv4（默认）
#   [::]:3309                       IPv6 双栈（Linux 同时接受 v4-mapped 与 v6；推荐）
#   [::1]:3309                      仅本机 IPv6
#   [240e:3a6:e15:e451::d24]:3309   绑定指定全球单播 IPv6
listen: 0.0.0.0:3309
# listen_unix: /run/glaciertdb/gt.sock   # UDS 本地连接加速（v1.3.13，仅 Linux）：
#                                         # 3309 协议多路复用整体架在 Unix domain socket 上，
#                                         # mysql/redis/amqp/mqtt 本地连接免 TCP 层开销；鉴权照旧
db_dir: /data          # 库目录（必须挂载目录，WAL 需可写）
default_db: backup     # 连接未指定库时的默认库（不存在则自动创建）
server_version: "8.99.999"   # 对外呈现的 MySQL 版本号

# 用户名固定为 glacier（管理面约定），此处仅配置密码；
# 管理面执行 SET PASSWORD='新密码' 后热生效并持久化到 <db_dir>/glacier.json
memory_limit_mb: 0     # Go 运行时软内存上限（0 = 不限制）
max_connections: 64    # 最大并发客户端连接数（超限直接断开）

auth:
  user: glacier            # 固定值，配置其他名字会被忽略；默认仅此一个管理账号（v1.3.6）
  password: "GlacierTDB@2026"   # 初始密码（首次启动引导进系统库；管理面 SET PASSWORD 热改后以此文件为重启基线）
  readonly_user: glacier_ro     # 只读账号（v1.0.9）：同等认证，仅允许查询与管理面查看
  readonly_password: ""         # 默认禁用（空 = 不创建只读账号）；需要时填密码启用

sqlite:
  synchronous: NORMAL      # OFF | NORMAL | FULL | EXTRA（持久化强度）
  busy_timeout_ms: 5000
  cache_size_kb: 256       # 每连接页缓存
  # --- SQLite 调优（v1.3.12；按「安全/性能/存储磨损」权衡，生效值启动日志可见）---
  wal_autocheckpoint: 1000     # WAL 自动 checkpoint 页数（默认 1000 = SQLite 缺省；
                               #   调大 → 写入更顺但 WAL 更大、崩溃恢复更慢；SD 卡关键旋钮）
  journal_size_limit_kb: 65536 # WAL 文件空间回收上限（0 = 不限；建议开启，防 -wal 膨胀）
  max_result_rows: 1000000 # 单查询返回行数上限（内存保护）

# TLS 加密（v1.3.12）：对 3309 复用端口（MySQL/RESP/AMQP/MQTT/ws）与 MQTT 独立
# 监听生效；同端口明文与 TLS 客户端自动共存（首字节 0x16 识别 TLS）：
#   redis-cli --tls -p 3309 / amqps:// / mqtts:// / wss:// 直连；
#   MySQL 标准客户端（--ssl-mode=REQUIRED）走握手协议内升级。
# 证书缺失时启动失败（fail-closed，不静默降级明文）。
# S3 端点 TLS 用 s3.endpoints[].tls / cert_file / key_file 单独配置。
tls:
  enable: false
  cert_file: ""        # 例：/data/certs/glaciertdb.pem
  key_file: ""         # 例：/data/certs/glaciertdb.key
  min_version: "1.2"   # 1.2 | 1.3

# 并发模型：读并发多线程（可按库限流）；写单库单线程互斥（多库写入并行）。
# 均可被管理面热改（USE GlacierTDB; SET GLOBAL_THREADS=32; 重启失效回到此处值）
concurrency:
  global_threads: 0              # 全局并发执行上限（读写共享，0=不限）
  per_db_read_threads: 0         # 全局默认：单库读并发上限（0=不限）
  per_db_read_threads_override:  # 按库覆盖（可选）
    # backup: 8
    # logs: 2

# 多核并行查询（v1.0.8）：hint /*+ PARALLEL(n) */ 显式触发；
# 无 hint 时单表可合并聚合语句估算行数 ≥ scan_rows 自动并行（0=关闭自动触发）
parallel_query:
  disable: false
  workers: 0            # 自动触发并行度（0 = CPU 核数，上限 32）
  scan_rows: 1000000    # 自动触发阈值

# 异步查询引擎（SUBMIT QUERY / 回调 / 定时窗口 / 分片回调）详见 docs/异步任务.md
async_query:
  enable: true
  workers: 2
  metrics_interval_sec: 30   # WHEN 资源采样周期（最低 10）
  result_retain_sec: 60      # 结果默认保留秒数（RETAIN 按任务覆盖）
  default_timeout_sec: 1800
  callback_max_inline_kb: 64 # 分片回调单片数据内联上限
  # --- SCRIPT 后处理 runtime（⚠ v1.3.13 起临时停用：带 SCRIPT 子句的提交显式报错，
  #     恢复与增强排在 v1.3.14；以下配置项保留，恢复后直接生效）---
  # nodejs_path: ""          # SCRIPT 后处理 runtime（.js；空=禁用该类脚本）
  # python_path: ""          # SCRIPT 后处理 runtime（.py；空=禁用）
  # php_path: ""             # SCRIPT 后处理 runtime（.php，v1.3.1；空=禁用）
  # script_dir: ""           # SCRIPT 白名单目录（脚本必须位于其下）

# 维护：VACUUM 会锁该库全部写入；no_hot_vacuum=true 禁止运行中 VACUUM（仅 CLI）
maintenance:
  no_hot_vacuum: false

# 查询 QoS（v1.0.10）：全系统 + 单库两级配额，读/写/异步任务执行统一记账
# 管理面热改（重启失效）：SET QOS GLOBAL QPS=500 / SET QOS DB backup QPS=100 / SET QOS DB backup CLEAR
qos:
  on_exceed: wait          # wait = 排队等待（默认）| reject = 立即拒绝（1040）
  global:
    qps: 0                 # 每秒查询数（令牌桶，0 = 不限）
    concurrency: 0         # 并发执行上限
    rows_per_sec: 0        # 扫描行吞吐上限
  databases: {}            # 单库覆盖，如 backup: { qps: 500, concurrency: 16 }

# 防爆破（v1.0.10）：登录失败计数 → 自动锁 IP / 账号（持久化，重启不解除）
lock:
  enable: true
  mode: mixed              # ip_only | account_only | mixed（独立锁 IP 或账号，任一触发即拒）
  window_sec: 300          # 失败计数窗口
  max_failures: 5          # 窗口内失败阈值（通用/账号）
  max_failures_ip: 30      # 按 IP 阈值（更宽防误杀；账号独立计数）
  max_failures_account: 5  # 按账号阈值
  lock_sec: 900            # 基础锁定时长（重复触发指数升级）
  lock_sec_max: 86400
  firewall: auto           # off | auto | ufw | iptables | firewall-cmd（系统层封锁，尽力而为）
  notify_url: ""           # 登录失败/锁定事件 HTTP 异步告警（空=关闭）
  notify_secret: ""        # 告警 HMAC 签名密钥

# 静态加密（adiantum，防 SQLite/Navicat 等工具直接读 .db 文件）；v1.3.8 起默认开启，
# 存量明文库启动时自动迁移（原件保留为 <db>.db.old-plaintext，确认后删除）
security:
  encrypt: true
  passphrase: "GlacierTDB"  # 默认固定口令（可改）；所有 .db 落盘即密文，协议层透明读写
  hide_version: false       # 版本号隐藏（v1.3.13）：开启后 S3 响应头/Redis INFO·HELLO/
                            # 管理面 glacier_version 不再携带真实版本号（MySQL 握手恒回 8.0.0）；
                            # 启动日志与 CLI 版本输出不隐藏（本机排障用）
# 键值/队列（v1.2.0）：mode:redis 在 3309 同端口提供 RESP 服务（声明行/嗅探进入）
# 详见 docs/键值队列.md
kv:
  enable: true            # RESP 服务开关（默认开；false = 3309 纯 MySQL、嗅探关闭）
  max_memory_mb: 64       # 内存上限（0 = 不限）；超限按 eviction 策略处理
  eviction: allkeys-lru   # allkeys-lru | volatile-lru | noeviction
  scan_interval_sec: 5    # TTL 主动扫描周期（最低 1）

# MySQL 协议服务（3309 复用端口上的 MySQL 面）
mysql:
  enable: true            # false = 3309 不再服务 MySQL（RESP/AMQP/MQTT 不受影响；
                          #        mysql/kv/mq 全关时不监听 3309，适合纯 S3 等独立部署）

# 端口复用嗅探窗口：等待客户端首包识别 mode:<service>/RESP/AMQP，
# 超时无数据按 MySQL 处理（MySQL 客户端静默等握手）；高 RTT 客户端可调大
mux_sniff_ms: 300

# 消息队列（v1.3.0）：mode:rabbitmq 在 3309 同端口提供 AMQP 0-9-1 基本队列
# 详见 docs/消息队列.md
mq:
  enable: true            # AMQP 服务开关（默认开；false 时 3309 不识别 AMQP）
  max_message_mb: 32      # 单条消息上限
  server_version: "3.13.0"   # 对外宣称的 RabbitMQ 版本串（Connection.Start server-properties，v1.3.3）
  mqtt:                   # MQTT 接入（v1.3.3）：桥接进 mqtt topic 交换机，认证走统一账号
    enable: true          # 开关（依赖 mq.enable）
    listen: ""            # 可选独立监听（tcp+ws 同端口，如 0.0.0.0:1883 或 [::]:1883；空 = 仅 3309 复用）
    ws_path: /mqtt        # 3309 上 WebSocket 升级路径

# 时序冷压缩与固化（v1.3.3）：points 表超龄数据自动 gzip 固化进 points_cold，
# 查询/写入触及冻结区间自动解冻（透明）；手动命令 COMPRESS/THAW/SHOW COLD
timeseries:
  cold_after_days: 0      # 数据年龄超过 N 天自动冷压缩（0 = 关闭自动策略，仅手动）
  cold_scan_min_sec: 600  # 后台扫描周期（最低 60）

# S3 对象存储（可选模块）：AWS Signature V4 兼容，独立 HTTP(S) 监听器（不进 3309 复用）
# 详见 docs/S3对象存储.md 与 docs/配置说明.md
s3:
  enable: false             # 开关（默认关）
  region: "*"               # '*' / 空 = 客户端任意 region 或不传；具体值 = 签名 scope 必须一致
                            # v1.3.12：region 仅作为全局签名校验维度，桶不再单独存储 region
  endpoints:
    - listen: 0.0.0.0:9000          # HTTP（可配多个端点；HTTPS 独立端口加 tls: true + 证书）
      # listen_unix: /run/glaciertdb/s3.sock   # S3 端点 UDS 监听（v1.3.13，仅 Linux）：
      #                                       # curl --unix-socket 直连，SigV4 鉴权照旧
      # listen: "[::]:9000"         # IPv6 / 双栈监听写法（同 3309）
      # tls: true
      # cert_file: /data/certs/wildcard.pem   # 端点泛域名证书（SNI 兜底）
      # key_file: /data/certs/wildcard.key
      server_names: []              # virtual-host 后缀（客户端访问主机名，如 s3.example.com）；
                                    # 未配置时域名访问也能按「首段命中已建桶」自动识别（v1.3.12）
  max_object_mb: 16384      # 单对象上限（默认 16GB；-1 = 不限制，v1.3.5）
  abort_incomplete_days: 7  # 未完成分片上传自动回收天数（v1.3.5；0 = 关闭）
  inline_max_kb: 64         # 内联存储阈值（超过走分块表）
  chunk_kb: 8192            # 分块大小（默认 8MB，v1.3.11）
  default_owner: glacier    # 建桶 / 签发密钥未指定属主时的默认用户
  limits:                   # 下载限速（0 = 不限）
    per_conn_bps: 0         # 单连接 bytes/s
    per_user_bps: 0         # 单用户总带宽（多连接合并聚合）
    per_user_conns: 0       # 单用户并发连接上限（超限 503 SlowDown）
  bucket_limits: {}         # 按桶覆盖，如 backup: { per_conn_bps: 1048576 }
  lifecycle_interval_sec: 3600   # 生命周期（自动删除）扫描周期
  # --- 上传回调三级配置（v1.3.12）：请求级 > 桶级 > 全局 ---
  # 请求级：PUT / CompleteMultipartUpload 带 x-glacier-callback-url / -secret 请求头
  # 桶级：SET S3 CALLBACK <bucket> URL '<url>' [SECRET '<s>']
  callback_url: ""          # 全局默认回调 URL（空 = 关闭）
  callback_secret: ""       # 全局默认 HMAC 签名密钥
  # image_font: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf  # 图片文字 ttf 字体（空=内置 ASCII）
  image_cache: true         # 图片预处理结果磁盘缓存（GET 加工链路；<db_dir>/sys/gimg_cache/）
  image_cache_mb: 1024      # 缓存容量上限（MB；超出按最久未用淘汰；-1 = 不限）
  # --- 存储效率与可观测性（v1.3.13）---
  # chunk 去重范围（chunk 池内容寻址共享的键前缀维度）：
  #   bucket = 桶内去重 | user = 同属主跨桶（默认）| system = 全实例
  # ⚠ system 档存在侧信道风险：攻击者可通过闪传（x-glacier-flash / quick_transfer）
  #   是否秒回探测他人是否拥有某文件，仅可信环境使用；范围切换不追溯既有数据
  dedup_scope: user
  gzip_level: 5             # GET 传输 gzip 压缩等级 1-9（0/非法回退 5；x-glaciertdb-gzip:0 请求头可按请求关闭）
  error_log: false          # S3 结构化错误日志（开启后所有错误落 JSON 行日志，凭 request-id 一查到底）
  archive_sync_max_mb: 512  # 打包下载「完成后下载」模式总大小上限（超限报错改用流式 tar）
  archive_tmp_max_mb: 4096  # 打包临时包目录 .s3tmp 容量上限（弹性驱逐：先完整下载过的旧包，再最旧）
  chunk_gc_ttl_sec: 3600    # 墓碑 chunk（删除后 refcnt=0）保留秒数，到期 GC 清数据
  # 数据主动同步（「数据北上」v1.3.13）：事件驱动推送到远端 S3 端点，规则数组可多条
  # sync:
  #   - name: backup-to-cloud
  #     bucket: edge-bucket          # 源桶
  #     match_prefix: ""             # 源 key 前缀过滤（空 = 全桶）
  #     remote_url: http://cloud.example.com:9000
  #     remote_region: us-east-1
  #     remote_bucket: my-backup
  #     remote_prefix: "edge/"       # 远端目标前缀目录（可空）
  #     remote_ak: AKXXXXXXXXXXXX
  #     remote_sk: SKXXXXXXXXXXXXXXXXXXXXXXXX
  #     sync_deletes: false          # 删除是否传播（备份语义默认不）
  #     skip_sync_origin: true       # 跳过带 sync-origin 标记的对象（断多跳同步环；默认 true）
  #     callback_url: ""             # 每对象同步结果回调（可空；HMAC 用 callback_secret）
  #     callback_secret: ""
  #     full_sync_on_start: false    # 启动时全量同步
  #     reconcile_sec: 0             # 定期对账周期秒（远端 List 比对缺漏补推；0 = 关）

# 主动心跳上报（v1.3.13，默认关）：定时 POST 规模/健康 JSON 到用户自建 HTTP 中心
# （实例 ID + 版本 + uptime + 各组件规模 + 错误计数；body HMAC 签名头 X-Glacier-Signature）
heartbeat:
  url: ""                  # 中心端 URL（空 = 关闭）
  interval_s: 60           # 上报周期（默认 60，最低 10）
  secret: ""               # body HMAC-SHA256 签名密钥（可空）
  fields: []               # payload 字段白名单（空 = 全部）

log:
  level: info              # debug | info | warn | error
  slow_query_ms: 200       # 慢查询阈值
  sql_log_file: ""         # SQL 审计日志（JSON 行：语句/OK|ERROR/错误消息/耗时/行数/连接），空=关闭
                           # 例：/data/sql.log（100MB 自动轮转为 .old）
